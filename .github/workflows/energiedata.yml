name: Energiedata bijwerken

on:
  schedule:
    - cron: "7 1 * * *"    # dagelijks 02:07 (winter) / 03:07 (zomer) Nederlandse tijd
  workflow_dispatch: {}    # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: energiedata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Gegevens ophalen
        env:
          SMP_API_KEY: ${{ secrets.SLIMME_METER_RJE || secrets.SMP_API_KEY }}
        run: python scripts/update_data.py

      - name: Opslaan in repository
        run: |
          git config user.name "energiedata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alle_data.js
          if git diff --cached --quiet; then
            echo "Geen nieuwe gegevens."
          else
            git commit -m "Energiedata bijgewerkt $(date +%Y-%m-%d)"
            git push
          fi
